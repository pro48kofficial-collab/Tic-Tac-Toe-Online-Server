<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XO Online</title><link rel="stylesheet" href="style.css"></head><body><div id="load"><div>❌ ⭕</div><h1>Хрестики Нулики</h1><div class="bar"><i id="p"></i></div><b id="pct">0%</b></div><div id="app" hidden><header><b>❌⭕</b><h1>Хрестики Нулики <small>ONLINE</small></h1></header><nav><button data-t="servers">🌐 Сервери</button><button data-t="top">🏆 Топ</button><button data-t="profile">👤 Профіль</button></nav><section id="servers"><div class="head"><h2>Сервери</h2><button id="create">＋ Створити</button></div><div id="list"></div></section><section id="top" hidden><h2>🏆 ТОП 100</h2><div id="pod"></div><div id="leaders"></div></section><section id="profile" hidden><h2>👤 Профіль</h2><div class="card"><div id="av">🙂</div><input id="nick" placeholder="Твій нік" maxlength="24"><label>📷 Аватарка <input id="file" type="file" accept="image/*"></label><button id="save">Зберегти</button><p id="rank"></p></div></section><section id="game" hidden><div id="players"></div><p id="status"></p><div id="board"></div><button id="again">🔄 Продовжити</button><button id="leave">← Вийти</button></section><div id="modal" hidden><div class="card"><h2>Створити сервер</h2><input id="rname" placeholder="Назва"><select id="size"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><p><label><input type="radio" name="privacy" value="1" checked> 🌐 Публічна</label><label><input type="radio" name="privacy" value="0"> 🔒 Приватна</label></p><button id="make">Створити</button><button id="cancel">Скасувати</button></div></div></div><script src="app.js"></script></body></html>
